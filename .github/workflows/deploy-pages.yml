name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct site bundle
        run: |
          cat .site-bundle/site.tar.gz.b64.part-* > /tmp/site.tar.gz.b64
          base64 --decode /tmp/site.tar.gz.b64 > /tmp/site.tar.gz
          mkdir -p _site
          tar -xzf /tmp/site.tar.gz -C _site
          sed -i \
            -e 's#="/assets/#="/peshotan-resume-portfolio/assets/#g' \
            -e 's#="/favicon.svg#="/peshotan-resume-portfolio/favicon.svg#g' \
            _site/index.html

          find _site/assets -type f -name '*.js' -exec sed -i \
            -e 's#"/peshotan-portrait.png#"/peshotan-resume-portfolio/peshotan-portrait.png#g' \
            -e 's#"/Peshotan-Irani-Resume.pdf#"/peshotan-resume-portfolio/Peshotan-Irani-Resume.pdf#g' \
            {} +

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
